[workspace]
name = "clifacet"
version = "0.2.0"
channels = ["https://prefix.dev/archont561/archont561", "conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.81.0"

[dependencies]
pixi-sandbox = "=0.9.0"
bun = { version = ">=1.4.2,<1.5", channel = "conda-forge" }
rust = "=1.99.1"
cargo-nextest = ">=0.9.150,<0.10"
cargo-llvm-cov = ">=0.9.1,<0.10"
cargo-deny = ">=0.20.2,<0.21"
cargo-audit = ">=0.22.1,<0.23"
# Conventional commits, versioning and changelog tooling for release prep.
convco = ">=0.7.2,<0.8"
# actionlint shells out for its shell checks instead of embedding them: without a
# `shellcheck` binary on PATH it silently skips every `run:` block. CI's runner has one
# and this environment did not, so the same actionlint run passed locally and failed in
# CI. Pinning it here makes both check the same shell with the same version.
# GPL-3.0 tooling: executed during development, never linked into or redistributed with
# the crate, so the dependency policy is untouched.
shellcheck = ">=0.11,<0.12"
actionlint = ">=1.7.12,<1.8"
lefthook = ">=2.2.2,<2.3"
llvm-tools = ">=23.1.4,<24"
python = ">=3.11,<4"

# alint is PyPI-only. The sandbox packs its wheel and restores it into the
# environment, so it must stay a pure wheel (pixi-pack refuses non-wheel PyPI
# dependencies). Keep it here rather than in `[dependencies]`.
# Pinned exactly: `.alint-baseline.json` records `alint_version: 0.20.1`, so a
# minor bump would need a baseline re-check rather than a silent range widening.
[pypi-dependencies]
alint = "==0.20.1"
# Test runner for scripts/tests. A pure `py3-none-any` wheel, so the sandbox can
# pack it alongside alint; pinned exactly for the same reason as alint.
pytest = "==9.2.0"

[activation.env]
LLVM_COV = "$CONDA_PREFIX/bin/llvm-cov"
LLVM_PROFDATA = "$CONDA_PREFIX/bin/llvm-profdata"

[tasks]
bun-install = "bun install --frozen-lockfile"
bun-install-offline = "bun install --frozen-lockfile --offline"
backlog = { cmd = "bun x --bun --no-install backlog", depends-on = ["bun-install"] }
skills = { cmd = "bun x --bun --no-install skills", depends-on = ["bun-install"] }
backlog-offline = { cmd = "bun x --bun --no-install backlog", depends-on = ["bun-install-offline"] }
skills-offline = { cmd = "bun x --bun --no-install skills", depends-on = ["bun-install-offline"] }
skills-check = "python scripts/check_skills.py"
backlog-check = { cmd = "bun x --bun --no-install backlog doctor", depends-on = ["bun-install"] }
# Every supported combination, derived from the crate's own manifest: the empty set, the
# default set, each frontend alone and all of them together. `--print-matrix` lists them.
check-features = "python scripts/check_features.py"
fmt = "cargo fmt --all"
fmt-check = "cargo fmt --all -- --check"
lint = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"
alint = "alint check --baseline .alint-baseline.json --strict-baseline --fail-on-warning"
# The guides are checked, not trusted: links and anchors resolve, every ```rust fence is
# compiled into the example crate's test suite, and every documented `clifacet::…` path
# names a public item. `--write` regenerates that file after editing a page.
check-docs = "python scripts/check_docs.py"
actionlint = "actionlint .github/workflows/*.yml"
# Conventional-commit check for the `commit-msg` hook; reads the proposed message from
# stdin. `--strip` matches Git's own cleanup of the comment block.
lint-commit = "convco check --from-stdin --strip"
deny = "cargo deny check"
audit = "cargo audit --deny warnings"
# The pre-push counterpart: audits against a local database when one exists and steps
# aside with a clear message when it does not, instead of blocking every offline push.
audit-offline = "python scripts/audit_local.py"
# Advisories need the RustSec database, so the other three checks are the offline-safe
# subset; `deny` (the full one) stays a CI task.
deny-offline = "cargo deny check bans licenses sources"
# An advisory exception with no expiry is a decision nobody revisits: this fails when the
# unmaintained crate is gone (so the exception must go too) or when the path the guide
# quotes no longer matches Cargo.lock. Offline: it reads three files and the lockfile.
check-advisory = "python scripts/check_advisory_exception.py"
# What `cargo publish` would upload, checked offline with `cargo package --list`: the
# licence texts and README must be in the tarball, and test scaffolding must not be.
check-packages = "python scripts/check_packages.py"
# `kind(proc-macro)` is separate: nextest classifies a proc-macro crate's own unit
# tests that way, so `kind(lib)` alone would skip the derive's diagnostics tests.
test-src = "cargo nextest run --workspace --all-features --locked -E 'kind(lib) + kind(proc-macro)'"
test-integration = "cargo nextest run --workspace --all-features --locked -E 'kind(test)'"
test = { depends-on = ["test-src", "test-integration"] }
test-doc = "cargo test --workspace --all-features --doc --locked"
coverage = "mkdir -p coverage && cargo llvm-cov nextest --workspace --all-features --locked --lcov --output-path coverage/lcov.info --ignore-filename-regex '(^|/)tests/' && python scripts/check_coverage.py coverage/lcov.info"
test-scripts = "python -m pytest scripts/tests"
docs-snippets = "python scripts/check_docs.py --write"
# Proves the declared MSRV. CI installs that toolchain; locally this needs rustup,
# or `--toolchain ""` to reuse the pinned compiler as a plumbing check.
prove-msrv = "python scripts/prove_msrv.py"
bump-version = "python scripts/bump_version.py"
# The changelog is rendered, not written: `convco changelog` reads the conventional commits
# through `.versionrc`, and the script turns its output into Keep a Changelog. `check` is
# what CI runs, so the committed copy cannot drift from the history it describes.
changelog = "python scripts/changelog.py regen"
changelog-check = "python scripts/changelog.py check"
# The release workflow's decisions, not its plumbing: `preflight` proves the version, the
# inherited manifests and the notes before anything is packaged; `package`, `report`,
# `publish` and `tag` are the four steps that used to be shell inside `release.yml`.
release = "python scripts/release.py"
# The `commit-messages` job: which commits this run introduced, and the convco call for
# them. Two branches that used to be a step output and a second shell step.
commit-range = "python scripts/commit_range.py"
# The `changes` job: whether this change is documentation only, and so which lane of CI
# it takes. Run it with EVENT/PR_BASE/PUSH_BASE set to see what CI would decide.
change-scope = "python scripts/change_scope.py"
# The RustSec database cache: its ISO week key, and resetting whatever the cache restored.
advisory-cache = "python scripts/advisory_cache.py"
# The offline, no-install subset worth running before every commit; `quality`
# also fetches Bun packages and the RustSec database, so it stays a CI command.
# One command from any checkout: reach the remote head, restore the environment, install
# the hooks, then prove the result with the fast checks.
bootstrap = "bash scripts/bootstrap.sh"
# The inner loop, and the gate `AGENTS.md` names: it runs after a restore, with
# `--no-install` and no network, so every task in it has to be offline-safe. That rules
# out `deny` (it fetches the RustSec database) in favour of `deny-offline`, and it is why
# `audit` is absent rather than replaced: an offline audit steps aside with a message,
# which is pre-push's job, not a gate's. `quality` is the CI command and keeps both.
test-local = { depends-on = ["fmt-check", "lint", "alint", "check-docs", "test", "test-doc", "test-scripts", "deny-offline", "check-advisory", "check-packages", "sandbox-check"] }
sandbox-plan = "pixi-sandbox plan --config pixi-sandbox.toml"
sandbox-check = "pixi-sandbox init --config pixi-sandbox.toml --script-path scripts/restore.sh --check"
hooks-install = "lefthook install"
quality = { depends-on = ["fmt-check", "lint", "alint", "check-docs", "changelog-check", "skills-check", "backlog-check", "check-features", "actionlint", "check-advisory", "check-packages", "deny", "audit", "sandbox-check"] }
