# TEMPORARY: reports why the MSRV job fails, as a check annotation, because the job logs
# are not readable from this environment. Deleted once the answer is in.
name: probe-msrv
on:
  push:
    branches: [arena/6534ab48-clifacet]
permissions:
  contents: read
jobs:
  msrv:
    name: probe the MSRV failure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install the declared toolchain
        run: |
          rustup toolchain install 1.88 --profile minimal --no-self-update
          rustup run 1.88 rustc --version
      - name: Run the MSRV check and keep its output
        shell: bash
        run: |
          set +e
          python3 scripts/prove_msrv.py > out.log 2>&1
          echo "exit=$?" >> out.log
      - name: Annotate the failure
        if: always()
        shell: bash
        run: |
          tail=$(grep -E "^(error|warning: unused|exit=)|-->" -A3 out.log | tail -c 3000 | tr '\n' '|')
          echo "::error title=MSRV FAILURE::$(echo "$tail" | sed 's/%/%25/g; s/\r//g')"
