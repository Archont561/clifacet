name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Repository and Rust quality
    runs-on: ubuntu-latest
    steps:
      # Full history: the changelog is rendered from the commits and tags, so a shallow
      # clone cannot answer whether the committed copy is current.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          frozen: true
      - name: Cache Cargo registry downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-
      # The key is an ISO year and week, and the two are not the calendar year: one
      # week can span two. Computed by a script so a test can assert the edge.
      - name: Select weekly advisory cache
        id: advisory-cache-key
        run: pixi run --frozen advisory-cache key
      - name: Cache advisory database clones
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/advisory-db
            ~/.cargo/advisory-dbs
          key: ${{ runner.os }}-rustsec-v1-${{ steps.advisory-cache-key.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-rustsec-v1-
      # A clone left dirty by a cancelled run makes the next audit fail for a reason
      # that has nothing to do with the code.
      - name: Clean restored advisory databases
        run: pixi run --frozen advisory-cache clean
      - name: Alint repository policy
        run: pixi run --frozen alint
      - name: Check agent skills
        run: pixi run --frozen skills-check
      - name: Check Backlog and frozen Bun dependencies
        run: pixi run --frozen backlog-check
      - name: Check the advisory exception is still warranted
        run: pixi run --frozen check-advisory
      - name: Check what each crate would publish
        run: pixi run --frozen check-packages
      - name: Check the documentation guides
        run: pixi run --frozen check-docs
      - name: Check the changelog matches the commits
        run: pixi run --frozen changelog-check
      - name: Check generated sandbox files
        run: pixi run --frozen sandbox-check
      - name: Lint GitHub Actions
        run: pixi run --frozen actionlint
      - name: Check feature boundaries
        run: pixi run --frozen check-features
      - name: Check Rust formatting
        run: pixi run --frozen fmt-check
      - name: Lint Rust
        run: pixi run --frozen lint
      - name: Check Cargo dependency policy
        run: pixi run --frozen deny
      - name: Audit Cargo dependencies
        run: pixi run --frozen audit

  coverage:
    name: Tests and source coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          frozen: true
      - name: Cache Cargo registry downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-
      - name: Test repository scripts
        run: pixi run --frozen test-scripts
      - name: Run coverage suite
        run: pixi run --frozen coverage
      - name: Run documentation tests
        run: pixi run --frozen test-doc
      - name: Upload source coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The claim and the toolchain are one value: the script reads
      # `[workspace.package] rust-version`, so CI cannot test a version other
      # than the one Cargo.toml advertises.
      # `python3` rather than Pixi: this job installs a second toolchain on purpose, so
      # it does not set Pixi up at all (decision-5).
      - name: Resolve the declared MSRV
        id: msrv
        run: python3 scripts/prove_msrv.py --github-output version
      # rustup, not Pixi: the Pixi environment pins exactly one compiler
      # (1.99.1), so proving an older floor needs a second toolchain. This is the
      # deliberate exception recorded in decision-5.
      # Two plain commands, no shell preamble: the runner's bash already exits on the
      # first failure, and there is nothing here for a script to decide.
      - name: Install the declared toolchain
        run: |
          rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal --no-self-update
          rustup run "${{ steps.msrv.outputs.version }}" rustc --version
      - name: Cache Cargo registry downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-
      - name: Check every feature boundary at the MSRV
        run: python3 scripts/prove_msrv.py

  # The supported platforms, with headless tests: every suite passes its own buffers
  # and scripts instead of a terminal, so "it needs a TTY" is never why a platform is
  # exempt. rustup rather than Pixi for the same reason the MSRV job gives — the checked
  # in Pixi environment is linux-64 only, and the question here is the code, not the
  # tooling wrapped around it. `fail-fast` is off so one broken platform cannot hide
  # whether the others still pass.
  platforms:
    name: Supported platforms (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Report the toolchain the runner provides
        run: |
          rustc --version
          cargo --version
      - name: Cache Cargo registry downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-
      # The base boundary is the one a dependency can break without any test noticing:
      # it is the configuration with no optional frontend enabled at all.
      - name: Check the empty feature set
        run: cargo check --locked --all-targets -p clifacet --no-default-features
      - name: Test every frontend together
        run: cargo test --workspace --all-features --locked
      - name: Test the documentation examples
        run: cargo test --workspace --all-features --locked --doc

  # The changelog, the version bump and the release notes are all derived from
  # commit messages (`.versionrc` maps each type to a section), and the pre-commit
  # hook that checks them is only local. This job makes the contract enforceable
  # for anyone who pushes without hooks or skips them.
  commit-messages:
    name: Conventional commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # convco walks the range, so it needs the commits, not just the merge tip.
          fetch-depth: 0
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          frozen: true
      # One step, because the range decision and the invocation that consumes it are one
      # decision: a branch's first push has no base, a pull request always does, and the
      # fallback checks the tip plus a window. `scripts/commit_range.py` owns it and
      # `scripts/tests/test_commit_range.py` exercises it without pushing anything.
      - name: Check the messages are conventional
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: pixi run --frozen commit-range check
