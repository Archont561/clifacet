name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Repository and Rust quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          frozen: true
      - name: Cache Cargo registry downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-
      - name: Select weekly advisory cache
        id: advisory-cache-key
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Cache advisory database clones
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/advisory-db
            ~/.cargo/advisory-dbs
          key: ${{ runner.os }}-rustsec-v1-${{ steps.advisory-cache-key.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-rustsec-v1-
      - name: Clean restored advisory databases
        run: |
          for db in "$HOME/.cargo/advisory-db" "$HOME"/.cargo/advisory-dbs/*; do
            if [ -d "$db/.git" ]; then
              git -C "$db" reset --hard HEAD
              git -C "$db" clean -ffdx
            fi
          done
      - name: Alint repository policy
        run: pixi run --frozen alint
      - name: Check agent skills
        run: pixi run --frozen skills-check
      - name: Check Backlog and frozen Bun dependencies
        run: pixi run --frozen backlog-check
      - name: Check generated sandbox files
        run: pixi run --frozen sandbox-check
      - name: Lint GitHub Actions
        run: pixi run --frozen actionlint
      - name: Check feature boundaries
        run: pixi run --frozen check-features
      - name: Check Rust formatting
        run: pixi run --frozen fmt-check
      - name: Lint Rust
        run: pixi run --frozen lint
      - name: Check Cargo dependency policy
        run: pixi run --frozen deny
      - name: Audit Cargo dependencies
        run: pixi run --frozen audit

  coverage:
    name: Tests and source coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          frozen: true
      - name: Cache Cargo registry downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-
      - name: Test repository scripts
        run: pixi run --frozen test-scripts
      - name: Run coverage suite
        run: pixi run --frozen coverage
      - name: Run documentation tests
        run: pixi run --frozen test-doc
      - name: Upload source coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The claim and the toolchain are one value: the script reads
      # `[workspace.package] rust-version`, so CI cannot test a version other
      # than the one Cargo.toml advertises.
      - name: Resolve the declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          version=$(python3 scripts/prove_msrv.py --print-toolchain)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $version"
      # rustup, not Pixi: the Pixi environment pins exactly one compiler
      # (1.99.1), so proving an older floor needs a second toolchain. This is the
      # deliberate exception recorded in decision-5.
      - name: Install the declared toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal --no-self-update
          rustup run "${{ steps.msrv.outputs.version }}" rustc --version
      - name: Cache Cargo registry downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-
      - name: Check every feature boundary at the MSRV
        run: python3 scripts/prove_msrv.py

  # The changelog, the version bump and the release notes are all derived from
  # commit messages (`.versionrc` maps each type to a section), and the pre-commit
  # hook that checks them is only local. This job makes the contract enforceable
  # for anyone who pushes without hooks or skips them.
  commit-messages:
    name: Conventional commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # convco walks the range, so it needs the commits, not just the merge tip.
          fetch-depth: 0
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          frozen: true
      # `before` is all zeros for a branch's first push, where there is no base to
      # compare against; a pull request always compares against its base commit.
      - name: Resolve the range to check
        id: range
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            echo "range=$PR_BASE..HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "$PUSH_BASE" ] && [ "$PUSH_BASE" != "0000000000000000000000000000000000000000" ]; then
            echo "range=$PUSH_BASE..HEAD" >> "$GITHUB_OUTPUT"
          else
            # No base at all: an empty range means "check the tip plus a small window",
            # which still catches the message written by the push that created the branch.
            echo "range=" >> "$GITHUB_OUTPUT"
          fi
      # Two invocations rather than one expanded variable: the runner's actionlint
      # also runs shellcheck, which rejects the unquoted form (SC2086) -- and that
      # copy of actionlint is stricter than the one in the Pixi environment.
      - name: Check the messages are conventional
        shell: bash
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          if [ -n "$RANGE" ]; then
            pixi run --frozen -x convco check "$RANGE"
          else
            pixi run --frozen -x convco check -n 20
          fi
