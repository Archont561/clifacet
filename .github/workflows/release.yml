name: release

# Publishing is deliberately manual. crates.io trusted publishing is bound to
# this path, the `crates` environment and both crate names; the environment is
# the authorization gate, so nothing here publishes on a push (decision-7).
#
# This file is plumbing: the environment gate, the OIDC token, the action pins and five
# steps. Every decision it used to make inline — which version, whether the notes are
# readable, whether a crate is already on the index, whether to tag — lives in
# `scripts/release.py`, so it can be tested instead of only being observed on a dispatch.
#
# Resumability: each crate is published only when its version is absent from the
# registry index, and the main crate is published only after the macro version
# is visible there. A run that published the macro crate and then failed can be
# re-run as-is; it skips what already exists instead of needing a revert.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Package and verify without publishing. Uncheck only to release, which
          additionally requires approval on the `crates` environment.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates
    timeout-minutes: 60
    # A job-level `permissions:` block is a replacement, not an addition: every
    # scope left out becomes none, so both are named here. `contents: write` is
    # for the tag and GitHub Release that follow a successful publish.
    permissions:
      contents: write
      id-token: write
    steps:
      # Full history, because the changelog and the notes are rendered from the commits
      # and tags, not read from a file. Credentials stay out of `.git/config`: the one push
      # this job makes is done by a script that takes the token from the environment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          cache: true
          frozen: true
      # Everything this job decides lives in `scripts/release.py`, so it can be tested
      # without a dispatch: the ref this run came from, the version the manifests record,
      # the crates inheriting it, and the changelog section that becomes the notes. A
      # missing section fails here, with nothing packaged and nothing to revert.
      - name: Preflight
        id: preflight
        run: pixi run --frozen release preflight
      # Only the macro crate can be packaged before anything is published: the main
      # crate's registry requirement on the macro crate cannot resolve until that exact
      # version exists there. The script knows which crate that is; naming it here would
      # be a second source of truth.
      - name: Package the macro crate
        run: pixi run --frozen release package
      - name: Report the dry run
        if: inputs.dry_run
        run: pixi run --frozen release report
      - name: Exchange the OIDC token for a short-lived crates.io token
        if: ${{ !inputs.dry_run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # Both crates go out in dependency order: publish, wait for the index, skip any
      # version already there. A failed index read aborts instead of publishing blind,
      # and a run that died between the two publishes is finished by re-running it.
      - name: Publish both crates in dependency order
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: pixi run --frozen release publish
      # The tag and the release notes land only after both crates are published, so a tag
      # never claims a version that is not on the registry. The notes file is the one
      # preflight verified, not a second reading of the changelog.
      - name: Tag the release and attach the changelog notes
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_PATH: ${{ steps.preflight.outputs.notes_path }}
        run: pixi run --frozen release tag
      # A version section names a tag, and the tag exists only after the publish above, so
      # the changelog cannot be part of the release commit. It is regenerated here from the
      # same commits the notes came from, and pushed as its own commit — the one thing a
      # release leaves for later, done by the run that knows the tag exists.
      - name: Regenerate the changelog for the tag
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pixi run --frozen release changelog
