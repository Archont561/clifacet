name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages when available (set false for build-only run)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Fumadocs Static Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages-status.outputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install documentation dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build static Fumadocs export (docs/out)
        working-directory: docs
        run: bun run build

      - name: Detect GitHub Pages availability
        id: pages-status
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLE_PAGES: ${{ vars.ENABLE_PAGES }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DEPLOY: ${{ inputs.deploy }}
        run: |
          set -euo pipefail
          write_status() {
            local enabled="$1"
            local note="$2"
            echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"
            echo "$note"
            {
              echo "### GitHub Pages status"
              echo ""
              echo "$note"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "${ENABLE_PAGES:-}" = "false" ]; then
            write_status "false" "Skipped deployment: repository variable \`ENABLE_PAGES\` is \`false\`."
            exit 0
          fi

          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${DISPATCH_DEPLOY}" = "false" ]; then
            write_status "false" "Skipped deployment: manual \`workflow_dispatch\` requested build-only mode."
            exit 0
          fi

          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          http_code="$(curl -sS -o "$body_file" -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages" || echo "000")"

          if [ "$http_code" = "200" ]; then
            build_type="$(jq -r '.build_type // ""' "$body_file")"
            if [ "$build_type" = "workflow" ]; then
              write_status "true" "GitHub Pages is enabled (source: GitHub Actions). Deploying \`docs/out\`."
            else
              write_status "false" "Skipped deployment: GitHub Pages \`build_type\` is \`${build_type:-unknown}\` (expected \`workflow\`). Set **Settings -> Pages -> Source: GitHub Actions** to enable automatic deploys."
            fi
          elif [ "$http_code" = "404" ] || [ "$http_code" = "403" ]; then
            write_status "false" "Skipped deployment: GitHub Pages is not enabled or unavailable for this repository (HTTP ${http_code}). Enable **Settings -> Pages -> Source: GitHub Actions** when ready."
          else
            echo "::warning::Unable to query GitHub Pages status (HTTP ${http_code}); skipping deployment."
            write_status "false" "Skipped deployment: unable to confirm GitHub Pages availability (HTTP ${http_code})."
          fi

      - name: Configure GitHub Pages
        if: ${{ steps.pages-status.outputs.enabled == 'true' }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: ${{ steps.pages-status.outputs.enabled == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/out

  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    if: ${{ needs.build.outputs.pages_enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
