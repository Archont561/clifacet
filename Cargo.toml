[workspace]
members = ["crates/clifacet", "crates/clifacet-macros", "examples/discovered", "examples/simple", "examples/backlog-lite"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Archont561/clifacet"
authors = ["Archont561 <142521648+Archont561@users.noreply.github.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
clifacet-macros = { version = "0.5.0", path = "crates/clifacet-macros" }

# Core command metadata, serialization and library-owned errors.
# Without clap's defaults: colour and "did you mean" suggestions are an application's
# choice, not something a library forces on it. An application that depends on clap with
# its defaults keeps both, because Cargo unifies features (CLI-44, decision-19 item 7).
# `string`: a settings file's value is a default, and `Arg::default_values` needs an owned
# one to carry it. Without the feature clap accepts only `'static` values, which would mean
# leaking one per run (CLI-51).
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "derive", "env", "string"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# The optional settings loader (CLI-51). `toml_edit` rather than `toml`: a value's span is
# what lets an invalid setting be reported at the line it was written on, and a loader that
# can only say "your file is wrong" sends the reader back to the whole file.
toml_edit = { version = "0.25.17", default-features = false, features = ["parse"] }

# Optional frontend adapters. Keep a single crossterm major/minor across both.
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = "0.29.0"

# Companion derive implementation.
# `span-locations`: `Span::local_file()`, which is how `clifacet::commands!()` with no
# list finds the folder it was written in (decision-19 item 4, CLI-50). The method needs
# proc-macro2 1.0.107+ and a compiler of 1.88+, which is this workspace's declared floor.
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
syn = "2.0.119"
# A subcommand's default name, computed exactly as clap's derive computes it, so the
# tree's duplicate-name check agrees with clap. Already in every build through clap.
heck = "0.5.0"

# Test tooling.
assert_cmd = "2.2.2"
trybuild = "1.0.122"
rstest = "0.28.0"
rstest-bdd = "=0.6.0"
rstest-bdd-macros = "=0.6.0"
proptest = "1.12.0"
