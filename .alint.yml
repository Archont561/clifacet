# yaml-language-server: $schema=https://alint.org/_alint/configuration/schema.json
version: 1

extends:
  - alint://bundled/ci/github-actions@v1

rules:
  - id: require-cargo-workspace
    kind: file_exists
    paths: "Cargo.toml"
    level: error
    message: "Required file Cargo.toml is missing."

  - id: require-cargo-lock
    kind: file_exists
    paths: "Cargo.lock"
    level: error
    message: "Required file Cargo.lock is missing."

  - id: require-pixi-manifest
    kind: file_exists
    paths: "pixi.toml"
    level: error
    message: "Required file pixi.toml is missing."

  - id: require-pixi-lock
    kind: file_exists
    paths: "pixi.lock"
    level: error
    message: "Required file pixi.lock is missing."

  - id: require-codecov-config
    kind: file_exists
    paths: "codecov.yml"
    level: error
    message: "Required file codecov.yml is missing."

  - id: require-deny-config
    kind: file_exists
    paths: "deny.toml"
    level: error
    message: "Required file deny.toml is missing."

  - id: require-lefthook-config
    kind: file_exists
    paths: "lefthook.yml"
    level: error
    message: "Required file lefthook.yml is missing."

  - id: require-convco-config
    kind: file_exists
    paths: ".versionrc"
    level: error
    message: "The convco configuration is missing; commit messages and the changelog would drift."

  - id: require-main-manifest
    kind: file_exists
    paths: "crates/clifacet/Cargo.toml"
    level: error
    message: "Required file crates/clifacet/Cargo.toml is missing."

  - id: require-command-core-doc
    kind: file_exists
    paths: "docs/reference/command-core.md"
    level: error
    message: "The command-core seam documentation is missing."

  # The documentation policy's structure, as files that must exist. A section with no
  # page is a section a reader follows and finds empty, which is how a documentation tree
  # starts to rot: the index promises five places and four of them hold something.
  - id: require-docs-index
    kind: file_exists
    paths: "docs/README.md"
    level: error
    message: "The documentation index is missing; nothing would be reachable by design."

  - id: require-docs-policy
    kind: file_exists
    paths: "docs/concepts/documentation-policy.md"
    level: error
    message: "The documentation policy is missing; what a change owes the docs would be unstated."

  - id: require-docs-architecture
    kind: file_exists
    paths: "docs/architecture/repository.md"
    level: error
    message: "The repository architecture page is missing."

  - id: require-docs-getting-started
    kind: file_exists
    paths: "docs/guides/getting-started.md"
    level: error
    message: "The getting-started guide is missing."

  - id: require-docs-development
    kind: file_exists
    paths: "docs/development/development.md"
    level: error
    message: "The development reference is missing."

  - id: require-docs-contributing
    kind: file_exists
    paths: "docs/development/contributing.md"
    level: error
    message: "The contributing guide is missing."

  - id: require-markdownlint-config
    kind: file_exists
    paths: ".markdownlint-cli2.yaml"
    level: error
    message: "The page-structure check's configuration is missing; the check would lint defaults."

  - id: require-readme-template
    kind: file_exists
    paths: ".readme/README.template.md"
    level: error
    message: "The README template is missing; `pixi run readme` would have nothing to render."

  - id: require-readme-renderer
    kind: file_exists
    paths: "scripts/readme.py"
    level: error
    message: "The README renderer is missing; the generated README would have no source."

  - id: require-dodo
    kind: file_exists
    paths: "dodo.py"
    level: error
    message: "The task graph is missing; `pixi run automation` would not start."

  - id: require-automation-bridge
    kind: file_exists
    paths: "automation/lib/tasks.py"
    level: error
    message: "The doit-to-script bridge is missing; every task in dodo.py would fail to import."

  - id: require-example-command
    kind: file_exists
    paths: "examples/simple/src/main.rs"
    level: error
    message: "The runnable example command is missing."

  - id: require-example-manifest
    kind: file_exists
    paths: "examples/simple/Cargo.toml"
    level: error
    message: "The standalone example crate is missing."

  - id: require-main-source
    kind: file_exists
    paths: "crates/clifacet/src/lib.rs"
    level: error
    message: "Required file crates/clifacet/src/lib.rs is missing."

  - id: require-macro-manifest
    kind: file_exists
    paths: "crates/clifacet-macros/Cargo.toml"
    level: error
    message: "Required file crates/clifacet-macros/Cargo.toml is missing."

  - id: require-macro-source
    kind: file_exists
    paths: "crates/clifacet-macros/src/lib.rs"
    level: error
    message: "Required file crates/clifacet-macros/src/lib.rs is missing."

  - id: require-ci-workflow
    kind: file_exists
    paths: ".github/workflows/ci.yml"
    level: error
    message: "Required file .github/workflows/ci.yml is missing."

  - id: require-sandbox-config
    kind: file_exists
    paths: "pixi-sandbox.toml"
    level: error
    message: "The sandbox policy is missing."

  - id: require-changelog
    kind: file_exists
    paths: "CHANGELOG.md"
    level: error
    message: "The changelog is missing; releases need notes."

  - id: require-bump-version
    kind: file_exists
    paths: "scripts/bump_version.py"
    level: error
    message: "The version bump script is missing."

  - id: require-bootstrap
    kind: file_exists
    paths: "scripts/bootstrap.sh"
    level: error
    message: "The session bootstrap script is missing."

  - id: require-audit-local
    kind: file_exists
    paths: "scripts/audit_local.py"
    level: error
    message: "The offline audit wrapper is missing."

  - id: require-prove-msrv
    kind: file_exists
    paths: "scripts/prove_msrv.py"
    level: error
    message: "The MSRV proof script is missing."

  - id: require-check-advisory
    kind: file_exists
    paths: "scripts/check_advisory_exception.py"
    level: error
    message: "The advisory-exception check is missing; the RustSec exception would never expire."

  # The workflows call these by task name; a missing script would break a release run
  # rather than a gate, which is the worst place to find out.
  - id: require-release-script
    kind: file_exists
    paths: "scripts/release.py"
    level: error
    message: "The release script is missing; release.yml has nothing to call."

  - id: require-commit-range-script
    kind: file_exists
    paths: "scripts/commit_range.py"
    level: error
    message: "The commit-range script is missing; the commit-messages job would not run."

  - id: require-advisory-cache-script
    kind: file_exists
    paths: "scripts/advisory_cache.py"
    level: error
    message: "The advisory-cache script is missing; the audit job's cache would not be reset."

  - id: require-github-actions-helper
    kind: file_exists
    paths: "scripts/github_actions.py"
    level: error
    message: "The GitHub Actions helper is missing; the scripts that report to a run would fail."

  - id: require-check-packages
    kind: file_exists
    paths: "scripts/check_packages.py"
    level: error
    message: "The package-contents check is missing; a release could ship an incomplete tarball."

  - id: require-check-docs
    kind: file_exists
    paths: "scripts/check_docs.py"
    level: error
    message: "The documentation checker is missing; the guides would be unverified prose."

  - id: require-check-features
    kind: file_exists
    paths: "scripts/check_features.py"
    level: error
    message: "The supported feature matrix script is missing; compatibility would be a claim again."

  # `backlog-check` runs this after `backlog doctor`. Deleting it would not fail the gate
  # by accident: the task would run a command that no longer exists.
  - id: require-check-backlog-status
    kind: file_exists
    paths: "scripts/check_backlog_status.py"
    level: error
    message: "The task-status check is missing; a card could finish and never say so."

  # The prose check (decision-20). Vale reads the generated pair; the authored source and
  # the script that renders it are the two files a writer could break the check by deleting.
  - id: require-prose-config
    kind: file_exists
    paths: "vale.toml"
    level: error
    message: "The prose check's authored configuration is missing; the generated INI would have no source."

  - id: require-prose-renderer
    kind: file_exists
    paths: "scripts/prose.py"
    level: error
    message: "The prose renderer is missing; .vale.ini and the style would be hand-edited again."

  - id: require-vale-ini
    kind: file_exists
    paths: ".vale.ini"
    level: error
    message: "Vale's configuration is missing; the prose check would lint nothing and pass."

  - id: require-release-workflow
    kind: file_exists
    paths: ".github/workflows/release.yml"
    level: error
    message: "The crates.io release workflow is missing."

  - id: require-sandbox-publisher
    kind: file_exists
    paths: ".github/workflows/publish-sandbox.yml"
    level: error
    message: "The generated sandbox publisher is missing."

  - id: require-sandbox-relock
    kind: file_exists
    paths: ".github/workflows/relock.yml"
    level: error
    message: "The generated sandbox relock workflow is missing."

  - id: require-sandbox-restore
    kind: file_exists
    paths: "scripts/restore.sh"
    level: error
    message: "The generated sandbox restore launcher is missing."

  - id: require-agent-rules
    kind: file_exists
    paths: "AGENTS.md"
    level: error
    message: "The agent rules are missing."

  - id: require-regain-direction-skill
    kind: file_exists
    paths: ".agents/skills/regain-direction/SKILL.md"
    level: error
    message: "The local regain-direction skill is missing."

  - id: require-bun-package
    kind: file_exists
    paths: "package.json"
    level: error
    message: "Required file package.json is missing."

  - id: require-bun-lock
    kind: file_exists
    paths: "bun.lock"
    level: error
    message: "Required file bun.lock is missing."

  - id: require-session-skill
    kind: file_exists
    paths: ".agents/skills/session/SKILL.md"
    level: error
    message: "Required file .agents/skills/session/SKILL.md is missing."

  - id: require-skills-check
    kind: file_exists
    paths: "scripts/check_skills.py"
    level: error
    message: "Required file scripts/check_skills.py is missing."

  - id: require-devcontainer-config
    kind: file_exists
    paths: ".devcontainer/devcontainer.json"
    level: error
    message: "The devcontainer configuration is missing."

  - id: require-devcontainer-setup
    kind: file_exists
    paths: ".devcontainer/setup.sh"
    level: error
    message: "The devcontainer setup script is missing."

  - id: cargo-workspace-members
    kind: toml_path_equals
    paths: [Cargo.toml]
    path: "$.workspace.members"
    equals:
      - crates/clifacet
      - crates/clifacet-macros
      - examples/discovered
      - examples/simple
      - examples/backlog-lite
    level: error
    message: Keep workspace membership explicitly reviewed.

  - id: gha-workflow-contents-read
    level: error
  - id: gha-pin-actions-to-sha
    level: error
