[package]
name = "clifacet-backlog-lite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "A friendly wrapper around the Backlog.md CLI, built on the published clifacet API"
publish = false

[[bin]]
name = "bl"
path = "src/main.rs"

[dependencies]
# The workspace leaves colour and suggestions off; an application turns them on.
clap = { workspace = true, features = ["color", "suggestions"] }
clifacet = { path = "../../crates/clifacet", features = ["interactive"] }

[dev-dependencies]
rstest.workspace = true
rstest-bdd.workspace = true
rstest-bdd-macros.workspace = true

[lints]
workspace = true
