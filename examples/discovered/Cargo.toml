[package]
name = "clifacet-discovered"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Declarative commands, proven without build scripts: subcommands and modules in pure Rust"
publish = false

[dependencies]
clap = { workspace = true, features = ["color", "suggestions"] }
clifacet = { path = "../../crates/clifacet" }

# The golden compile-fail case in `tests/ui/`: a helper has to be unreachable from
# outside its folder, and the message saying so is part of the promise (CLI-50, AC#4).
[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true
