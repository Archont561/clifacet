[package]
name = "clifacet-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Procedural macros for Clifacet"
readme = "../../README.md"

[lib]
proc-macro = true

[dependencies]
heck.workspace = true
proc-macro2.workspace = true
quote.workspace = true
# `full`: a forwarded value is any expression — `range = 1..=8`, `fill = Level::Basic`,
# `value_parser = clap::value_parser!(u8).range(1..=8)` — and syn parses those only with
# it. Declared here rather than inherited from clap_derive's feature unification, which
# holds in an application's build and not in this crate's own.
# `visit`: `input = Type` is walked for the tokens the generated impls cannot name.
syn = { workspace = true, features = ["full", "visit"] }

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true
