[package]
name = "clifacet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Composable command-line presentation modes"
readme = "../../README.md"

[features]
# Each frontend is a dependency boundary: an application enables the ones it uses and
# pays for no others. The TUI's components are public either way — see `tui` in the docs.
default = []
interactive = ["dep:inquire"]
tui = ["dep:ratatui", "dep:crossterm"]
json = ["dep:serde_json"]

# Both escape hatches are demonstrated in an example that can be run, not only in tests.
[[example]]
name = "tui_custom_screen"
required-features = ["tui"]

# The parity harness, used the way an outside crate would use it.
[[example]]
name = "parity_report"
required-features = ["tui"]

[dependencies]
clifacet-macros.workspace = true
clap.workspace = true
serde.workspace = true
thiserror.workspace = true
inquire = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd.workspace = true
trybuild.workspace = true
rstest.workspace = true
rstest-bdd.workspace = true
rstest-bdd-macros.workspace = true
proptest.workspace = true

[lints]
workspace = true
