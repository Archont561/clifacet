# Generated by scripts/prose.py from vale.toml. Edit vale.toml, not this file.
#
# Vale checks how the guides read. Alint (`alint check`) checks what the repository
# is: files that must exist, naming, manifests, workflows. The split is deliberate —
# a file-existence rule in Vale would be a rule nobody can run, and a style
# preference in .alint.yml would be a check that cannot see a sentence.

StylesPath = .vale/styles
MinAlertLevel = warning

# Pinned releases, not names: `pixi run prose-sync` installs exactly these, so an
# upstream update cannot change what CI rejects without a commit here.
Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip, https://github.com/vale-cli/write-good/releases/download/v0.4.1/write-good.zip

Vocab = Clifacet

[*.md]
BasedOnStyles = Vale, Microsoft, write-good, Clifacet

# The inherited rules this repository sets its own way, each because the guides
# are written that way on purpose. The reasons are in vale.toml.
Microsoft.Dashes = NO
#   Em dashes are spaced — like this — everywhere in the guides. The reference style sets them closed; this prose is read in a terminal-width editor, where the spaced form is what stays legible at 80 columns.
Microsoft.Contractions = NO
#   The guides write "cannot" rather than "can't", and keep both words wherever a contraction would be ambiguous. Plain, formal English is the register here.
Microsoft.Semicolon = NO
#   Semicolons pair two clauses in this prose, and the sentences are written that way on purpose. The rule is only a suggestion in the guide it comes from.
Microsoft.We = NO
#   The guides have no author voice: no first person singular or plural appears in them.
Microsoft.Vocab = NO
#   The guides describe promises and behavior; that is not marketing language.
Microsoft.Avoid = NO
#   `backend` is the domain's word for what this library sits in front of. The reference style lists it as jargon; here it is the least ambiguous term available.
Microsoft.HeadingAcronyms = NO
#   `CI`, `TUI` and `MSRV` are heading words here; expanding them in a heading helps nobody.
Microsoft.HeadingColons = NO
#   A heading may end in a colon when it introduces the table or list below it.
write-good.ThereIs = NO
#   A sentence may open with "There is" when it introduces the list of what exists.
write-good.TooWordy = NO
#   A subject that needs one long sentence gets one long sentence.
write-good.E-Prime = NO
#   The guides describe what a thing is, not what it does; the rule reads that as hedging.
Vale.Terms = NO
#   The vocabulary exists to make the project's own words words at all, not to enforce their case. Tool names appear both as prose and as command text, and a case rule cannot tell "pixi run" from a sentence about Pixi.

[backlog/**/*.md]
BasedOnStyles = Vale

[CHANGELOG.md]
BasedOnStyles = Vale
